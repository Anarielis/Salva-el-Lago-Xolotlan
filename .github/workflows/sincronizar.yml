name: Sincronizar ramas
on:
  push:
    branches: [ desarrollo ]

jobs:
  crear-pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/create-pull-request@v5
        with:
          base: main
          branch: desarrollo
          title: "Actualización desde desarrollo"
          body: "Sincronización automática desde rama desarrollo"
