<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto – Salvá el Lago Xolotlán</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>Contacto</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Proyectos</a>
      <a href="contacto.html" class="active">Contacto</a>
    </nav>
  </header>

  <main class="contact">
    <h2>Únete a la causa</h2>

    <!-- Formspree: reemplaza TU_CORREO por tu correo real -->
    <form id="contactForm" action="madrigalanarielis16@gmail.com" method="POST">
      <label>Nombre completo:</label>
      <input type="text" name="name" required>

      <label>Correo electrónico:</label>
      <input type="email" name="_replyto" required>

      <label>Mensaje:</label>
      <textarea name="message" rows="4" required></textarea>

      <button type="submit" class="btn">Enviar mensaje</button>
    </form>

    <section class="extra">
      <h3>Síguenos</h3>
      <p>
        🌎 <a href="https://www.facebook.com/JICANicaragua?mibextid=ZbWKwL">Facebook</a><br>
        📍 Managua, Nicaragua
      </p>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Salvá el Lago Xolotlán</p>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
